<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <link rel="stylesheet" href="login_dashboard.css">
</head>
<body>

<div class="form-box">
    <div class="image">
        <img src="users-gear-solid-full.svg" >
        
    </div>
    <h2>Login</h2>

    <form id="loginForm">
        <label>Username:</label>
        <input type="text" id="loginUsername" >
        <label>Password:</label>
        <input type="password" id="loginPassword">

        <button style="background-color: blue;" type="button" onclick="login()">Sign In</button>
        <button  style="background-color:red;" type="button" onclick="location.href='signUp.html'">Sign Up</button>
    </form>
</div>

<script src="script1.js"></script>
</body>
</html>
