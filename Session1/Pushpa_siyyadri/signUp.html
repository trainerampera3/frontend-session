<!DOCTYPE html>
<html>
<head>
    <title>Sign Up</title>
    <link rel="stylesheet" href="signup.css">
</head>
<body>

<div class="signup-container">
<!-- <div class="image">
        <img src="users-gear-solid-full.svg" >;
        
    </div> -->
    <h2>Sign Up</h2>

    <form id="signupForm" >

        <div class="form-row">
            <label>Name :</label>
            <input type="text" id="name" placeholder="Enter name">
        </div>

        <div class="form-row">
            <label>Username :</label>
            <input type="text" id="username" placeholder="Enter username">
        </div>

        <div class="form-row">
            <label>Email :</label>
            <input type="email" id="email" placeholder="Enter email">
        </div>

        <div class="form-row">
            <label>Password :</label>
            <input type="password" id="password" placeholder="Enter password">
        </div>

        <div class="form-row">
            <label>Confirm Password :</label>
            <input type="password" id="confirmPassword" placeholder="Confirm password">
        </div>

        <div class="button-row">
            <button  style="background-color: blue;"; type="button" onclick="signup()">Submit</button>
            <button  style="color: black;" type="reset">Clear</button>
            <button style="color: black;" type="button" onclick="location.href='logIn.html'">Cancel</button>
        </div>

    </form>

</div>


    <footer>
    <p>© 2026 My Website. All Rights Reserved.</p>
</footer>


<script src="script1.js"></script>

</body>

</html>
