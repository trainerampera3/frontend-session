<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style_sign_up.css">
    <title>SignUp</title>
</head>
<body>
<div class="signup">
<div class="logo"><img src="company.png"></div>
<div class="form_">
<form novalidate>
<div class="name">
    <label>Name:</label>
    <input id="ename" type="text" required>
</div>
<div class="Username">
    <label>Username:</label>
    <input id="eusername" type="text" required>
</div>
<div class="gmail">
    <label>Email:</label>
    <input id="eemail" type="email" required>
</div>
<div class="password">
    <label>Password:</label>
    <input id="epassword" type="password" required>
</div>
<div class="confirm_pass">
    <label>Conform Password:</label>
    <input id="econ_pass"  type="password" required>
</div>
<div class="buttons">
<button type="submit">submit</button>
<button type="button" class="clear">Clear</button>
<button type="button" class="back">Back</button>
</div>
</form>
</div>
</div>
<script src="signup.js"></script>
</body>
</html>
