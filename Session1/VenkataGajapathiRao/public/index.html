<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My-Website</title>
    <link rel="stylesheet" href="../styles/index.css">
</head>
<body>
    <div class="container">
        <form id="loginForm" class="auth-form" novalidate>
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRSVNLH1I8DbPVU191rfYUBBtNswR82qiki7dhX0WDNtw&s=10" width="100" height="100" alt="" srcset="">
            
           <div class="container-labels">
             <div class="input-group">
                <label for="loginEmail">Email<span class="required">*</span></label>
                <input type="email" id="loginEmail" required>
                <span class="error-message" id="loginEmailError"></span>
            </div>

            <div class="input-group">
                <label for="loginPassword">Password <span class="required">*</span></label>
                <input type="password" id="loginPassword" required>
                <span class="error-message" id="loginPasswordError"></span>
            </div>
           </div>
            <div class="auth-options">
                <label for="Sign-Up" onclick="window.location.href='./signup.html'" class="navigation">New User?</label>

            <button type="submit">Log In</button>
            </div>
        </form>
    </div>
    <script src="./scripts/test.js"></script>
</body>
</html>
